name: Zoom Meeting Auto-Joiner

on:
  workflow_dispatch:
    inputs:
      meeting_link:
        description: 'Zoom Meeting Join Link (after you register manually)'
        required: true
        default: 'https://bytexl-in.zoom.us/j/1234567890'
        type: string
      display_name:
        description: 'Display Name in Meeting'
        required: true
        default: 'Meeting Bot'
        type: string
      duration_minutes:
        description: 'Duration to stay in meeting (minutes)'
        required: true
        default: 60
        type: number

jobs:
  join-zoom-meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          sudo apt-get update
          wget -q https://
