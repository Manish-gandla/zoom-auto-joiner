name: Zoom Meeting Auto-Joiner

on:
  workflow_dispatch:
    inputs:
      meeting_link:
        description: 'Zoom Meeting Link'
        required: true
        default: 'https://bytexl-in.zoom.us/meeting/register/PW9oV6oCQ7mG4d1zmLyR7w'
        type: string
      display_name:
        description: 'Display Name in Meeting'
        required: true
        default: 'Meeting Bot'
        type: string
      duration_minutes:
        description: 'Duration to stay in meeting (minutes)'
        required: true
        default: 60
        type: number

jobs:
  join-zoom-meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          # Install Chrome directly from .deb (handles deps automatically)
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
          
          # Install additional tools needed for headless mode
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libnspr4 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            fonts-liberation \
            libu2f-udev \
            libvulkan1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Run Zoom Meeting Joiner (stay indefinitely)
        env:
          ZOOM_MEETING_LINK: ${{ github.event.inputs.meeting_link || 'https://bytexl-in.zoom.us/meeting/register/PW9oV6oCQ7mG4d1zmLyR7w' }}
          ZOOM_DISPLAY_NAME: ${{ github.event.inputs.display_name || 'Meeting Bot' }}
          SESSION_DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || 60 }}
        run: |
          echo "=== Starting Zoom Bot ==="
          echo "Meeting: $ZOOM_MEETING_LINK"
          echo "Duration: $SESSION_DURATION_MINUTES minutes"
          echo ""
          echo "🟢 Bot is launching Chrome and navigating to the meeting..."
          python join_zoom.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-screenshots
          path: /tmp/screenshots/
          retention-days: 7
